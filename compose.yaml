services:
  postgres:
    image: postgres:18-alpine
    container_name: tasktab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tasktab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tasktab}
      POSTGRES_DB: ${DB_NAME:-tasktab_development}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ espera o mount em /var/lib/postgresql (os dados ficam num
      # subdiretorio por versao major), nao mais em /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-tasktab} -d ${DB_NAME:-tasktab_development}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
